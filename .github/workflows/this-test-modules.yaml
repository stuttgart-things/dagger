---
name: Test Changed Modules
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - feature/*
      - fix/*

# Run `dagger functions -m ./<module>` against every module touched
# in the PR/push so schema or flag regressions (e.g. flag-name
# collisions inside a module) surface before release. Tracked in
# https://github.com/stuttgart-things/dagger/issues/262 (P2.1).
#
# `engine-version` sits alongside it and covers what per-module testing
# structurally cannot: an invariant that holds *between* modules. The
# matrix below only ever sees changed modules, one at a time, so it
# cannot notice that the module next door declares a different engine.
# See https://github.com/stuttgart-things/dagger/issues/338.

permissions:
  contents: read

jobs:
  engine-version:
    name: engineVersion agreement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Every module must declare the same engineVersion. Deliberately
      # does NOT pin the expected value: a bump PR should be able to move
      # all modules together without also editing this workflow. What is
      # rejected is *disagreement* -- one module drifting away from the
      # rest, which is how https://github.com/stuttgart-things/dagger/issues/338
      # came back after being swept once in #264.
      - name: All modules declare one engineVersion
        run: |
          set -euo pipefail

          versions=$(jq -r '.engineVersion // "<missing>"' */dagger.json | sort -u)
          count=$(printf '%s\n' "$versions" | wc -l)

          if [[ "$count" -eq 1 ]]; then
            echo "OK: all $(ls -d */dagger.json | wc -l) modules on ${versions}"
            exit 0
          fi

          echo "::error::engineVersion drift: ${count} distinct values across */dagger.json"
          echo
          echo "Declared versions and the modules declaring them:"
          for v in $versions; do
            echo "  $v"
            for f in */dagger.json; do
              [[ "$(jq -r '.engineVersion // "<missing>"' "$f")" == "$v" ]] \
                && echo "    - ${f%/dagger.json}"
            done
          done
          echo
          echo "Pick one version and set it in every */dagger.json."
          echo "Note that 'dagger develop' rewrites engineVersion to the version"
          echo "of the CLI that runs it, so a develop on an outdated CLI is a"
          echo "common way for a single module to drift."
          exit 1

  detect-modules:
    name: Detect changed modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute changed modules
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$BASE_REF"
            base="origin/${BASE_REF}"
            range="${base}...HEAD"
          else
            # Push event. If the "before" SHA is unknown (force push,
            # first push, etc.) fall back to the last commit only.
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]] \
              || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              range="HEAD~1...HEAD"
            else
              range="${BEFORE_SHA}...${HEAD_SHA}"
            fi
          fi

          echo "Diff range: $range"
          changed_files=$(git diff --name-only "$range" || true)
          echo "Changed files:"
          echo "$changed_files"

          modules=()
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            top="${path%%/*}"
            [[ "$top" == "$path" ]] && continue  # top-level file, not a module dir
            [[ -f "${top}/dagger.json" ]] || continue
            modules+=("$top")
          done < <(printf '%s\n' "$changed_files")

          # Dedup, preserve sort order
          if [[ ${#modules[@]} -gt 0 ]]; then
            mapfile -t modules < <(printf '%s\n' "${modules[@]}" | sort -u)
          fi

          count=${#modules[@]}
          if [[ $count -eq 0 ]]; then
            json="[]"
          else
            json=$(printf '%s\n' "${modules[@]}" | jq -R . | jq -sc .)
          fi

          echo "Changed modules ($count): $json"
          echo "modules=$json" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

  test-modules:
    name: dagger functions (${{ matrix.module }})
    needs: detect-modules
    if: needs.detect-modules.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-modules.outputs.modules) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Install Dagger CLI
        env:
          DAGGER_VERSION: 0.21.9
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/dagger" version

      - name: dagger functions -m ./${{ matrix.module }}
        run: dagger functions -m "./${{ matrix.module }}"

      - name: dagger develop -m ./${{ matrix.module }}
        run: dagger develop -m "./${{ matrix.module }}"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: ${{ matrix.module }}
          args: --config=${{ github.workspace }}/.golangci.yml
          only-new-issues: true

      # Smoke tests: run the module's fixtures against the real container.
      # Invoked as scripts rather than via `task` because the Taskfile has a
      # remote `includes:` that Task refuses to load non-interactively
      # ("not trusted by user"), and auto-trusting a mutable remote ref in CI
      # is not worth it. `task test-<module>` runs the same scripts locally.
      #
      # Allowlisted rather than dynamic because several modules' tests need
      # secrets (SOPS_AGE_KEY, registry creds) unavailable here. Add a module
      # once tests/smoke/<module>.sh exists and runs without secrets.
      - name: smoke test ${{ matrix.module }}
        if: contains(fromJSON('["ansible", "crossplane", "terraform"]'), matrix.module)
        run: ./tests/smoke/${{ matrix.module }}.sh
