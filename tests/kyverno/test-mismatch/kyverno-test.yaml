# The same policy and resources as ../test, with both expectations inverted.
# Test must fail on this: a run that passes here means mismatches go unseen.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: disallow-latest-tag-mismatch
policies: [policy.yaml]
resources: [resources.yaml]
results:
  - policy: disallow-latest-tag
    isValidatingPolicy: true
    kind: Pod
    resources: [pinned-tag]
    result: fail
  - policy: disallow-latest-tag
    isValidatingPolicy: true
    kind: Pod
    resources: [latest-tag]
    result: pass
